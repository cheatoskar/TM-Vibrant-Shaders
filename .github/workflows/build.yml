name: build

# Every push builds the mod on a clean machine, which proves the repo contains everything
# needed. A "v*" tag also publishes a GitHub release with the zip, the DLL and SHA-256 sums.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the tag build creates the release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The tag is the version (v1.0.0-beta.1 -> 1.0.0-beta.1). A tag with a suffix is a
      # pre-release. bash, so the -D flag reaches CMake unmangled.
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "flag=-DTM_SHADERS_VERSION=$version" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # TrackMania Forever is 32-bit, so everything is built for Win32.
      - name: Configure
        shell: bash
        run: cmake -S . -B build -A Win32 ${{ steps.v.outputs.flag }}

      - name: Build
        run: cmake --build build --config Release

      # The configured version must be the one inside the shipped DLL.
      - name: Verify version
        shell: pwsh
        run: |
          $line = Select-String -Path build/tm_shaders_version.h -Pattern '^#define TM_SHADERS_VERSION_A "(.+)"$'
          $want = $line.Matches[0].Groups[1].Value
          Write-Host "configured version: '$want'"
          if ($want -notmatch '^\d+\.\d+\.\d+') { Write-Host "::error::'$want' is not a version"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes("build/Release/TMVibrantShaders.dll")
          if (-not [System.Text.Encoding]::ASCII.GetString($bytes).Contains($want)) {
            Write-Host "::error::TMVibrantShaders.dll does not contain '$want'"; exit 1
          }
          Write-Host "OK - the DLL carries $want"

      # dist/: TM-Vibrant-Shaders.zip, TMVibrantShaders.dll, SHA256SUMS.txt
      - name: Package
        run: cmake --build build --config Release --target release_zip

      # Release notes: RELEASE_NOTES.md, then a SHA-256 table (where people actually look).
      - name: Release notes
        shell: pwsh
        run: |
          $body = @()
          if (Test-Path RELEASE_NOTES.md) { $body += Get-Content RELEASE_NOTES.md -Encoding utf8; $body += "" }
          $body += @("<details>", "<summary>SHA-256 checksums</summary>", "", "| File | SHA-256 |", "|---|---|")
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $h, $f = $line -split "  ", 2
            $body += "| ``$f`` | ``$h`` |"
          }
          $body += @("", "Check a download in PowerShell: ``Get-FileHash .\TM-Vibrant-Shaders.zip -Algorithm SHA256``", "</details>")
          $body | Set-Content -Encoding utf8 dist/release-notes.md
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TM-Vibrant-Shaders
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TM Vibrant Shaders ${{ steps.v.outputs.version }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          files: |
            dist/TM-Vibrant-Shaders.zip
            dist/TMVibrantShaders.dll
            dist/SHA256SUMS.txt
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          generate_release_notes: true

  # TM Vibrant Shaders for ManiaPlanet (TrackMania 2): a separate 64-bit D3D11 project. A tag adds
  # its zip to the release the windows job made (after it, so there is one release).
  maniaplanet:
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "flag=-DTM_SHADERS_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: bash
        run: cmake -S maniaplanet -B build-mp -A x64 ${{ steps.v.outputs.flag }}

      - name: Build
        run: cmake --build build-mp --config Release --target tmvs_mp

      # dist-mp/TM-Vibrant-Shaders-ManiaPlanet.zip: the DLL, the install and uninstall scripts and
      # the README; next to it the DLL and its SHA-256.
      - name: Package
        shell: pwsh
        run: |
          $stage = "package-mp/TM Vibrant Shaders for ManiaPlanet"
          New-Item -ItemType Directory -Force $stage, dist-mp | Out-Null
          Copy-Item build-mp/Release/d3d11.dll, maniaplanet/install.ps1, maniaplanet/Install.cmd, maniaplanet/Uninstall.cmd $stage
          Copy-Item maniaplanet/README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.txt"
          Compress-Archive -Path $stage -DestinationPath dist-mp/TM-Vibrant-Shaders-ManiaPlanet.zip
          Get-FileHash dist-mp/TM-Vibrant-Shaders-ManiaPlanet.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  TM-Vibrant-Shaders-ManiaPlanet.zip" } | Set-Content -Encoding ascii dist-mp/SHA256SUMS-ManiaPlanet.txt
          Get-Content dist-mp/SHA256SUMS-ManiaPlanet.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TM-Vibrant-Shaders-ManiaPlanet
          path: dist-mp/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-mp/TM-Vibrant-Shaders-ManiaPlanet.zip
            dist-mp/SHA256SUMS-ManiaPlanet.txt
          fail_on_unmatched_files: true
