name: build

# Every push builds the mod on a clean machine, which proves the repo contains everything
# needed. A "v*" tag also publishes a GitHub release with the zip, the DLL and SHA-256 sums.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the tag build creates the release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The tag is the version (v1.0.0-beta.1 -> 1.0.0-beta.1). A tag with a suffix is a
      # pre-release. bash, so the -D flag reaches CMake unmangled.
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "flag=-DTM_SHADERS_VERSION=$version" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # TrackMania Forever is 32-bit, so everything is built for Win32.
      - name: Configure
        shell: bash
        run: cmake -S . -B build -A Win32 ${{ steps.v.outputs.flag }}

      - name: Build
        run: cmake --build build --config Release

      # TrackMania 2 (ManiaPlanet): a separate 64-bit D3D11 project. Its d3d11.dll goes into the
      # same zip (the setup installs either game), so it is built before the package.
      - name: Configure ManiaPlanet
        shell: bash
        run: cmake -S maniaplanet -B build-mp -A x64 ${{ steps.v.outputs.flag }}

      - name: Build ManiaPlanet
        run: cmake --build build-mp --config Release --target tmvs_mp

      # The configured version must be the one inside both shipped DLLs.
      - name: Verify version
        shell: pwsh
        run: |
          $line = Select-String -Path build/tm_shaders_version.h -Pattern '^#define TM_SHADERS_VERSION_A "(.+)"$'
          $want = $line.Matches[0].Groups[1].Value
          Write-Host "configured version: '$want'"
          if ($want -notmatch '^\d+\.\d+\.\d+') { Write-Host "::error::'$want' is not a version"; exit 1 }
          foreach ($dll in "build/Release/TMVibrantShaders.dll", "build-mp/Release/d3d11.dll") {
            $bytes = [System.IO.File]::ReadAllBytes($dll)
            if (-not [System.Text.Encoding]::ASCII.GetString($bytes).Contains($want)) {
              Write-Host "::error::$dll does not contain '$want'"; exit 1
            }
          }
          Write-Host "OK - both DLLs carry $want"

      # dist/: TM-Vibrant-Shaders.zip (TMNF/TMUF and TM2), TMVibrantShaders.dll, SHA256SUMS.txt
      - name: Package
        run: cmake --build build --config Release --target release_zip

      # Release notes: RELEASE_NOTES.md, then a SHA-256 table (where people actually look).
      - name: Release notes
        shell: pwsh
        run: |
          $body = @()
          # {{TAG}} in the notes: this build's tag (pictures from the tagged tree, also for a pre-release).
          if (Test-Path RELEASE_NOTES.md) { $body += (Get-Content RELEASE_NOTES.md -Encoding utf8) -replace '\{\{TAG\}\}', $env:GITHUB_REF_NAME; $body += "" }
          $body += @("<details>", "<summary>SHA-256 checksums</summary>", "", "| File | SHA-256 |", "|---|---|")
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $h, $f = $line -split "  ", 2
            $body += "| ``$f`` | ``$h`` |"
          }
          $body += @("", "Check a download in PowerShell: ``Get-FileHash .\TM-Vibrant-Shaders.zip -Algorithm SHA256``", "</details>")
          $body | Set-Content -Encoding utf8 dist/release-notes.md
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TM-Vibrant-Shaders
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TM Vibrant Shaders ${{ steps.v.outputs.version }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          files: |
            dist/TM-Vibrant-Shaders.zip
            dist/TMVibrantShaders.dll
            dist/SHA256SUMS.txt
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          generate_release_notes: true

  # The ModLoader update server: modloader/index.json (stable releases) and
  # modloader/beta/index.json (with pre-releases) on GitHub Pages, served from the gh-pages
  # branch. Rebuilt after every tag's release from every release's TMVibrantShaders.dll (from
  # 1.4.0-rc.2 on): the zip the ModLoader downloads (the DLL alone) is made here and served next
  # to the index, so the releases carry no zip people take by mistake. Run the workflow by hand
  # to rebuild it without a release.
  # One-time setup: Settings -> Pages -> Deploy from a branch -> gh-pages, / (root).
  modloader-server:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: modloader-server
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      # Each version's DLL comes from its release (checked against the digest GitHub lists); its
      # zip goes to site/modloader/files/<version>/ and is hashed there.
      - name: Index
        run: |
          python3 tools/modloader_server.py index --out-dir site/modloader
          python3 tools/modloader_server.py check site/modloader/index.json site/modloader/beta/index.json
          touch site/.nojekyll
          # The icon both indexes and packaging/description.yaml point at: served with the index,
          # so it shows in the ModLoader from the first release on (not only once it is on main).
          cp packaging/icons/icon_a.png site/modloader/icon.png
          for dir in site/modloader site/modloader/beta; do
            printf '<!doctype html><meta charset="utf-8"><title>TM Vibrant Shaders ModLoader server</title><p>TrackMania ModLoader update server for <a href="https://github.com/%s">TM Vibrant Shaders</a>. Add <code>https://%s.github.io/%s/%s/</code> under <code>servers:</code> in <code>%%LOCALAPPDATA%%\\TMLoader\\config.yaml</code>. Versions: <a href="index.json">index.json</a>.</p>\n' \
              "$GITHUB_REPOSITORY" "${GITHUB_REPOSITORY_OWNER,,}" "${GITHUB_REPOSITORY#*/}" "${dir#site/}" > "$dir/index.html"
          done

      # The site is generated whole each time: one fresh commit, force-pushed.
      - name: Publish to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "cheatoskar"
          git config user.email "140116603+cheatoskar@users.noreply.github.com"
          git add -A
          git commit -q -m "ModLoader server from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
