executable: TMVibrantShaders.dll
dependencies:
  - id: CoreMod
    version: ^1.0.1
changelog: '- 1.4.1-preview: a cleaner neon trail (no gaps, no fan around a standing car) and a real snow storm sound; new: the mod for TrackMania 2 (ManiaPlanet). 1.4.0-preview: new F8 menu with a preset gallery, photo mode (F6) with a compare split (Shift+F6), real night under night skies (on by default), map clips off (Shift+F7), colour looks from .cube files, clean long shadows and reflections, Island sea with waves, game bloom off while the mod shades. 1.3: Snow (Snowstorm preset), Author''s Shader (a look stored in the map), the black hole lights the space skies, setting search and reset arrows in the menu, preset transitions, steadier long shadows and fixes for water stripes. 1.2: TrackMania United Forever support, real rain and thunder sound, volumetric light, bounce light, lightning bolts, water by height, a neon light trail and the Realistic preset.'
