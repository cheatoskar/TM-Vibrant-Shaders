executable: TMVibrantShaders.dll
dependencies:
  - id: CoreMod
    version: ^1.0.1
changelog: '- 1.4.0: TrackMania 2 (ManiaPlanet 4) support (one zip for both games); new F8 menu with a preset gallery, share codes and rebindable hotkeys; light sources from the game itself (Game HDR, Game light sources); real night under night skies; long shadows from the game''s meshes, fences included; render scale with AMD FSR 1; MP4 video export; photo mode (F6) with a compare split (Shift+F6) against the game or a preset; depth of field focus on the car; neon trail from the car''s real position; colour looks from .cube files; clean water; works next to the 100% TMX mod. 1.3: Snow (Snowstorm preset), Author''s Shader (a look stored in the map), the black hole lights the space skies, setting search and reset arrows in the menu, preset transitions, steadier long shadows and fixes for water stripes. 1.2: TrackMania United Forever support, real rain and thunder sound, volumetric light, bounce light, lightning bolts, water by height, a neon light trail and the Realistic preset.'
