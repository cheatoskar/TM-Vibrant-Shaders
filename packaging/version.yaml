executable: TMVibrantShaders.dll
dependencies:
  - id: CoreMod
    version: ^1.0.1
changelog: '- 1.6.1: Photo mode no longer switches itself on online (the server''s free camera at the end of a round); fewer short stalls from read-backs (sea level, minimap, HDR numbers); the log shows where the CPU''s time goes and the game''s Cpu/Gpu synchro. 1.6.0: TrackMania Sunrise (Windows 10 repack) and TrackMania Original (Online Patch v2), experimental; clips and the MP4 video export with the game''s sound on Nations ESWC, Sunrise and Original; checkpoint clips; the same features as Horizon Client modules (TMVS 2.0.0, a separate zip). 1.5.0: Instant replay clips for Nations/United (the whole run as an MP4 after a finish, F3 for the last seconds, the game''s sound, its own Clips page), TrackMania Nations ESWC gets the car and the race (neon trail, headlights, spray, split times), TrackMania 2 gets photo zoom, hi-res photos, TAA jitter, Hide car and the Misc page, and the menu starts with CenterSpeed loaded. 1.4.3: Dirt no longer mirrors walls after the replay editor, the car stays smooth with TAA, no wake above a sunken car, the effects run on maps where F7 changed nothing, and the mod works next to the VR mod TrackMania Forever OpenXR (experimental). 1.4.2: New video export in the replay editor: the mod renders and sums every sample and motion blur sub-frame, NVENC driven directly on NVIDIA cards with a quality slider measured with VMAF, HDR10, 10-bit HEVC and AV1, ffmpeg as encoder, a Video page with presets (YouTube, Best, Editing, Small, Discord, HDR10), film shutter, lens depth of field, cinema crop, and the game''s own sound in the export (thunder in time with the flashes). 1.4.1: TrackMania 2 (ManiaPlanet 4) support (one zip for both games); new F8 menu with a preset gallery, share codes and rebindable hotkeys; light sources from the game itself (Game HDR, Game light sources); real night under night skies; long shadows from the game''s meshes, fences included; render scale with AMD FSR 1; MP4 video export; photo mode (F6) with a compare split (Shift+F6) against the game or a preset; depth of field focus on the car; neon trail from the car''s real position; colour looks from .cube files; clean water; works next to the 100% TMX mod. 1.3: Snow (Snowstorm preset), Author''s Shader (a look stored in the map), the black hole lights the space skies, setting search and reset arrows in the menu, preset transitions, steadier long shadows and fixes for water stripes. 1.2: TrackMania United Forever support, real rain and thunder sound, volumetric light, bounce light, lightning bolts, water by height, a neon light trail and the Realistic preset.'
