name: TM Clips
author: cheatoskar
type: modification
homepage: 'https://github.com/cheatoskar/TM-Vibrant-Shaders'
description: 'Instant replay clips for TrackMania Nations/United Forever: the game is recorded into memory all the time, and after a finish the run (3 s before the start to 3 s after the finish) is saved as an MP4 with the game''s sound, or the last 30 s with F3. Clips go to Documents\TrackMania\Clips. Settings with Shift+F3. With TM Vibrant Shaders installed, its menu has these settings and this mod stays idle.'
executable: TMClips.dll
dependencies:
  - id: CoreMod
    version: ^1.0.1
changelog: '- 0.1.0: First version: a buffer of 60 s in memory (NVIDIA''s encoder, else the graphics card''s through Windows), save on finish (personal best or every finish), save key, the game''s own sound, a small settings window.'
